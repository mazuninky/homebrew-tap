name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # main
        with:
          core: false
          cask: false

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.set-up-homebrew.outputs.gems-hash != ''
        run: brew install-bundler-gems

      # Homebrew refuses to load formulae from a third-party tap until it is trusted.
      - name: Trust this tap
        run: brew trust mazuninky/tap

      # What `brew tap` checks for a trusted tap: every formula loads on every
      # OS and architecture, so each one needs a URL for all of them.
      - name: brew readall (every OS and architecture)
        run: brew readall --os=all --arch=all mazuninky/tap

      - name: brew style
        run: brew style mazuninky/tap

      - name: brew audit
        run: brew audit --strict --online --tap=mazuninky/tap

  # actionlint (syntax, expressions, shellcheck on `run:` scripts) and zizmor
  # (security audits, configured in .github/zizmor.yml). zizmor runs offline:
  # its online audits follow upstream branches and tags, which would turn a
  # required check red without a change in this repository.
  workflows:
    name: workflows (actionlint + zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: zizmor@1.32.0

      # go install checks the module against the Go checksum database.
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor --offline --min-severity low --format github .
  # The one required status check: the branch ruleset requires this job
  # instead of each job above, whose names change with the matrix.
  ci-success:
    name: ci-success
    needs: [lint, workflows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All CI checks passed"
